<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather App</title>
    <link rel="stylesheet" href="weatherStyle.css">
    <script src="weatherScript.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Live Weather App</h1>
        <div class="search-box">
            <input type="text" placeholder="Enter city name" id="cityInput">
            <div class="button-wrapper">
                <button onclick="getWeather()">Search</button>
            </div>
        </div>
    </div>

    <!-- Add the popup container -->
    <div id="weatherPopup" class="popup">
        <div class="popup-content">
            <span class="close-button" onclick="closePopup()">&times;</span>
            <div id="weatherInfo">
                <!-- Weather data will be displayed here -->
            </div>
        </div>
    </div>
</body>
</html>
